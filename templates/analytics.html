{% extends "base.html" %}

{% block title %}Analytics — Spendly{% endblock %}

{% block content %}
<section class="cs-section">
    <div class="cs-card">
        <div class="cs-corner cs-corner--tl"></div>
        <div class="cs-corner cs-corner--tr"></div>
        <div class="cs-corner cs-corner--bl"></div>
        <div class="cs-corner cs-corner--br"></div>

        <div class="cs-icon">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <polyline points="12 6 12 12 16 14"/>
            </svg>
        </div>

        <span class="cs-badge">Coming Soon</span>

        <h1 class="cs-title">Advanced Analytics</h1>

        <p class="cs-body">We're working on powerful insights and visualizations to help you understand your spending patterns better.</p>

        <div class="cs-dots">
            <span class="cs-dot"></span>
            <span class="cs-dot"></span>
            <span class="cs-dot cs-dot--active"></span>
        </div>

        <p class="cs-tagline">We're crafting something special</p>
    </div>
</section>
{% endblock %}
